# Reviewer TDGL sensitivity baseline

grid:
  Nx: 60
  Ny: 30
  hx: 0.5
  hy: 0.5

tdgl:
  kappa: 2.0
  sigma1: 1.0
  sigma2: 1.0
  sigma3: 1.0
  u: 5.79
  gamma: 40.0
  Tc1: 1.0
  Tc2: 1.0
  Tc3: 1.0
  Tc1gap: 0.2
  Tc3gap: 0.0

thermal:
  enabled: true
  C_eff: 1.0
  k_eff: 5.0
  T0: 0.18
  epsilon_type: linear
  eta_env: 10.0
  eta_hole: 0.1
  holewidth: 20.0

fields:
  He: 0.0

boundary:
  bc_x: periodic
  bc_y: neumann
  bc_y_coverage: 0.88
  loop: false
  field_side: both
  psi_y_zero: false

noise:
  strength: 0.001

sweep:
  Jpeak: 0.3
  n_current_points: 99
  input_folder: none
  stable_time: 5000.0
  dt_snapshots: 1.0
  skip_ratio: 0.9
  run_up: false
  run_down: true
  psi_up_init: 1.0
  T_initial_up: 0.0
  psi_down_init: 0.0
  T_initial_down: 1.2

outputs:
  generate_mp4: false
  mp4_fps: 5
  frames_per_point: 20
